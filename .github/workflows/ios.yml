# FILE: .github/workflows/ios.yml
#
# Costruisce l'app iOS su un Mac di GitHub.
#
# Serve a una cosa precisa: il codice Swift si compila solo su macOS, e non
# tutti hanno un Mac in grado di farlo. Questo file affida il lavoro a un Mac
# vero, in affitto per pochi minuti, che compila l'app, esegue i test e
# fotografa il risultato. Per i repository pubblici quei minuti non si pagano.
#
# Il backend non passa da qui: ha i suoi test e girano altrove.

name: App iOS

on:
  push:
    branches: ['**']
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

# Un push che arriva mentre il precedente è ancora in corso annulla quello
# vecchio: interessa sempre e solo l'ultimo stato del codice.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  costruisci:
    name: Compila e prova
    runs-on: macos-latest
    timeout-minutes: 40

    # Serve al passo che riporta le schermate dentro il repository.
    permissions:
      contents: write

    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      # Cosa c'è su questa macchina. Serve a scegliere Xcode e il simulatore
      # senza indovinare: i nomi cambiano a ogni aggiornamento dell'immagine.
      - name: Cosa c'è sul Mac
        run: |
          sw_vers
          echo "--- Xcode disponibili ---"
          ls /Applications | grep -i '^Xcode' || true
          echo "--- Xcode in uso ---"
          xcodebuild -version
          swift --version

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto
        run: |
          xcodegen generate
          echo "--- schemi e target ---"
          xcodebuild -list -project Nina.xcodeproj

      # Il nome dei simulatori cambia da un'immagine all'altra ("iPhone 15",
      # "iPhone 17 Pro"…). Invece di scriverne uno a caso si prende il primo
      # iPhone disponibile e si usa il suo identificativo.
      - name: Scegli un simulatore
        id: simulatore
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "
          import json, sys
          dati = json.load(sys.stdin)['devices']
          for runtime in sorted(dati, reverse=True):
              if 'iOS' not in runtime: continue
              for d in dati[runtime]:
                  if d.get('isAvailable') and d['name'].startswith('iPhone'):
                      print(d['udid']); sys.exit(0)
          sys.exit('nessun iPhone disponibile')
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      # Il passo che conta.
      #
      # L'output completo si salva su file e si mostra solo il riassunto degli
      # errori: la prima volta il log era di novemila righe, quasi tutte avvisi
      # provenienti dalle macro di SwiftData, e l'unico errore vero stava in
      # mezzo. Il riassunto finisce anche nella pagina del workflow, così si
      # legge senza scaricare niente.
      - name: Compila l'app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Nina.xcodeproj \
            -scheme Nina \
            -configuration Debug \
            -destination "id=${{ steps.simulatore.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > compilazione.log 2>&1 && ESITO=0 || ESITO=$?

          grep -E "(error|warning): " compilazione.log \
            | sed "s|$GITHUB_WORKSPACE/ios/||" \
            | sort -u > diagnostica.txt || true

          ERRORI=$(grep -c "error: " diagnostica.txt || true)
          AVVISI=$(grep -c "warning: " diagnostica.txt || true)

          {
            echo "## Compilazione"
            echo ""
            echo "**$ERRORI errori**, $AVVISI avvisi distinti."
            if [ "$ERRORI" -gt 0 ]; then
              echo ""
              echo '```'
              grep "error: " diagnostica.txt | head -60
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "───────── errori ─────────"
          grep "error: " diagnostica.txt | head -60 || echo "(nessuno)"
          echo "──────────────────────────"

          exit $ESITO

      - name: Esegui i test unitari
        run: |
          set -o pipefail
          xcodebuild test \
            -project Nina.xcodeproj \
            -scheme Nina \
            -configuration Debug \
            -destination "id=${{ steps.simulatore.outputs.udid }}" \
            -derivedDataPath build \
            -only-testing:NinaTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      # Da qui in poi è tutto in più: se qualcosa non riesce, la compilazione
      # resta comunque verde. `if: always()` perché se l'app si costruisce le
      # schermate si possono fotografare anche quando un test è rosso.
      - name: Avvia l'app e fai gli screenshot
        if: always()
        continue-on-error: true
        run: |
          UDID="${{ steps.simulatore.outputs.udid }}"
          APP=$(find build/Build/Products -name 'Nina.app' -maxdepth 3 | head -1)
          echo "App trovata in: $APP"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          # Ora fissa e batteria piena: gli screenshot di Apple sono sempre
          # così, e una barra di stato che cambia rende le immagini di build
          # diverse non confrontabili.
          xcrun simctl status_bar "$UDID" override \
            --time "09:41" --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiMode active --wifiBars 3 || true

          xcrun simctl install "$UDID" "$APP"
          mkdir -p ../schermate

          # Una schermata nei due temi. Il simulatore si comanda da script e
          # nessuno può toccare lo schermo: per andare oltre la prima schermata
          # si riavvia l'app con un argomento diverso.
          fotografa() {
            nome="$1"; shift
            xcrun simctl terminate "$UDID" it.nina.app 2>/dev/null || true
            xcrun simctl ui "$UDID" appearance light || true
            xcrun simctl launch "$UDID" it.nina.app "$@"
            sleep 7
            xcrun simctl io "$UDID" screenshot "../schermate/$nome.png"

            xcrun simctl ui "$UDID" appearance dark || true
            sleep 3
            xcrun simctl io "$UDID" screenshot "../schermate/$nome-scuro.png"
            xcrun simctl ui "$UDID" appearance light || true
          }

          fotografa "1-benvenuto" -ninaAzzera
          fotografa "2-accesso"   -ninaAzzera -ninaOnboardingVisto

          ls -la ../schermate

      # Le schermate finiscono nel repository, non solo negli allegati.
      #
      # Gli allegati si scaricano da un dominio che non tutte le reti
      # raggiungono; un'immagine nel repository invece si guarda dal telefono
      # aprendo GitHub, senza scaricare niente.
      #
      # Non innesca un giro infinito: il workflow parte solo per modifiche
      # sotto ios/, e GitHub non riavvia i workflow per i commit fatti con il
      # token automatico.
      - name: Salva le schermate nel repository
        if: always()
        continue-on-error: true
        working-directory: .
        run: |
          git add schermate 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Le schermate non sono cambiate."
            exit 0
          fi

          git config user.name "Mac di GitHub"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Schermate dal simulatore, $(date -u '+%d/%m/%Y %H:%M') UTC"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "Salvate in schermate/"

      - name: Raccogli gli screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schermate
          path: schermate/
          if-no-files-found: ignore
          retention-days: 14

      - name: Raccogli i log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-compilazione
          path: |
            ios/compilazione.log
            ios/diagnostica.txt
          if-no-files-found: ignore
          retention-days: 7
